---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]
instances:
- id:       partition
  module:   partition
  config:   partition.conf
- id:       users
  module:   users
  config:   users.conf
- id:       cleanup
  module:   shellprocess
  config:   cleanup.conf
sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition@partition
  - users@users
  - summary
- exec:
  - partition@partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users@users
  - removeuser
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - initramfs
  - grubcfg
  - bootloader
  - shellprocess@cleanup
  - umount
- show:
  - finished
branding: ar-os
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
