---
dontChroot: false
timeout: 120
script:
  - "rm -f /etc/sddm.conf.d/99-ar-os-live-autologin.conf"
  - "rm -f /home/${USER}/Desktop/install-ar-os.desktop"
  - "systemctl enable sddm.service NetworkManager.service"
i18n:
  name: "Finalizing AR OS"
  description: "Remove live-session configuration from the installed system."

